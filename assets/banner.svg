<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Particle Glow -->
    <radialGradient id="particle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* CSS Animations for Dynamic Dynamic Backdrop Aspects */
    @keyframes floatWave {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.03); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes moveGrid {
      0% { transform: translateY(0px); }
      100% { transform: translateY(40px); }
    }

    .dynamic-bg-wave {
      animation: floatWave 8s ease-in-out infinite;
      transform-origin: center;
    }

    .dynamic-pulse {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .tech-grid {
      animation: moveGrid 10s linear infinite;
    }

    /* Foreground Text Styling - High Contrast & Static Layering */
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#accent-grad);
      letter-spacing: -0.5px;
    }

    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #e2e8f0;
      letter-spacing: 0.3px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- DYNAMIC BACKGROUND LAYER (Strictly behind text & foreground elements) -->
  <g class="dynamic-bg-wave" opacity="0.25">
    <path d="M-100,260 C150,180 350,320 600,240 C850,160 1050,300 1300,220 L1300,400 L-100,400 Z" fill="#4f46e5" />
    <path d="M-100,290 C200,230 400,340 700,260 C1000,180 1150,320 1300,280 L1300,400 L-100,400 Z" fill="#0284c7" opacity="0.6" />
  </g>

  <!-- Glowing Dynamic Nodes in Background -->
  <g class="dynamic-pulse">
    <circle cx="150" cy="90" r="70" fill="url(#particle-glow)" />
    <circle cx="1050" cy="270" r="90" fill="url(#particle-glow)" />
    <circle cx="920" cy="80" r="50" fill="url(#particle-glow)" />
  </g>

  <!-- Floating Tech Pattern Elements (Behind Text) -->
  <g opacity="0.15">
    <circle cx="200" cy="120" r="4" fill="#38bdf8" />
    <circle cx="240" cy="80" r="6" fill="#818cf8" />
    <line x1="200" y1="120" x2="240" y2="80" stroke="#38bdf8" stroke-width="1.5" />
    
    <circle cx="1000" cy="140" r="5" fill="#c084fc" />
    <circle cx="1060" cy="180" r="7" fill="#38bdf8" />
    <line x1="1000" y1="140" x2="1060" y2="180" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND LAYER (Guaranteed clear visibility for text) -->
  
  <!-- Category Badge Container -->
  <g transform="translate(100, 65)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="17" r="6" fill="#10b981" />
    <text x="36" y="22" class="badge-text">🤖 CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="155" class="banner-title" filter="url(#glow)">Awesome AI Interview Platform</text>

  <!-- Subtitle -->
  <text x="100" y="205" class="banner-subtitle">
    Top SaaS Products &amp; Open-Source Projects for AI Hiring, Voice Screening &amp; Technical Assessment
  </text>

  <!-- Key Metrics / Feature Pill Highlights (Foreground Layer) -->
  <g transform="translate(100, 245)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🎙️ Voice Interviewers</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">📊 Automated Scoring</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">💻 Technical Assessment</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(630, 0)">
      <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⭐ Open-Source Stacks</text>
    </g>
  </g>
</svg>
